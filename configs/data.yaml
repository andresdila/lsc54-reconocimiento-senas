# Fuente oficial del dataset LSC-54 (Mora-Zarate et al., 2025).
# Solo se descargan los videos crudos: datos.json (51,4 GB) contiene la
# aumentación x45 del autor, que NO usamos (ver reports/e1_plan, sección Datos).
dataset:
  name: LSC-54
  version: V4
  doi: 10.57760/sciencedb.25639
  license: CC BY-NC 4.0
  landing_page: https://www.scidb.cn/en/detail?dataSetId=0fa5acc6293543bba9a39a822988843e
  paper_doi: 10.1016/j.dib.2025.112145
  download_url: https://download.scidb.cn/download?fileId={file_id}

files:
  - name: "Videos Colors.zip"
    file_id: b07b8f10b384965b6067b0bebfad040a
    md5: 061e743579451cc762ad181ee78d7508
    bytes: 294419025
    session: S1   # campaña de grabación de colores (carpetas 1-20)
  - name: "Videos Courtesy.zip"
    file_id: 76fa12dbe08e6d7e08549d80447ab1bd
    md5: 52a3d816ee36bc665bc3a34e3260719d
    bytes: 485232781
    session: S2   # campaña de cortesía + números (carpetas 1,3,17,19,21-34)
  - name: "Videos Numbers.zip"
    file_id: 667b87e99c7a35f756fdfa9a031ff4a6
    md5: 661913a2eed223cd5cbed5033f9a5645
    bytes: 189586508
    session: S2

# Archivos dentro de los zips que se excluyen y por qué (trazabilidad).
exclude:
  - pattern: "Videos Courtesy/*/Números/*"
    reason: "Copia de 'Videos Numbers.zip' (29 de 30 archivos idénticos por CRC32+tamaño); la fuente canónica es Videos Numbers.zip"

# Normalización de etiquetas: nombre de carpeta -> etiqueta canónica.
# Las carpetas se pasan a minúsculas, sin tildes y con '_' antes de aplicar este mapa.
label_fixes:
  dies: diez
  denada: de_nada
  maso_menos: mas_o_menos

paths:
  raw_zips: data/raw/zips
  raw_videos: data/raw/videos
  inventory: data/inventory/lsc54_v4_inventory.csv
